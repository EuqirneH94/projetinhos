<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecos dos Faróis · Portal dos Heróis</title><style>
:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;color:#eee9df}*{box-sizing:border-box}
body{max-width:940px;min-height:100vh;margin:auto;padding:50px 28px;background:radial-gradient(ellipse at 75% 45%,#536e79 0%,#173d50 40%,#071723 85%);font:15px/1.65 "Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;inset:32% 0 0;z-index:-1;background:linear-gradient(180deg,#739daa9c,#153341e0);clip-path:polygon(0 79%,15% 56%,25% 70%,39% 19%,53% 65%,69% 28%,83% 63%,93% 40%,100% 60%,100% 100%,0 100%)}
body:after{content:"";position:fixed;inset:45% 0 0;z-index:-1;background:linear-gradient(#183846bb,#06141ce8);clip-path:polygon(0 49%,22% 77%,36% 26%,50% 65%,68% 35%,84% 76%,100% 22%,100% 100%,0 100%)}
h1{font:normal clamp(42px,6vw,64px)/1.1 Georgia,serif;color:#f1d399;margin:8px 0 12px}h2{font:normal 29px Georgia,serif;color:#f1d399}
body>p:first-of-type{font-size:17px;max-width:590px;color:#d4e2de}
form,#management{background:#09232fdc;border:1px solid #e0c28a80;border-radius:16px;padding:25px;box-shadow:0 16px 65px #0007;backdrop-filter:blur(9px)}
#management{margin-top:20px}#management form{box-shadow:none;background:#102f3ab0}
label{display:block;margin:14px 0;color:#c2d6d5;font-size:13px}input,select{display:block;width:100%;margin-top:7px;padding:12px;background:#102c37;color:#fff2df;border:1px solid #b0a57c7c;border-radius:7px;font:inherit}
input:focus,select:focus{outline:2px solid #e6c886}
button{margin-top:12px;padding:12px 20px;border:1px solid #f5dcaa;border-radius:7px;background:linear-gradient(120deg,#efdbb1,#c8a46c);color:#172a32;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:not-allowed}
ul{padding:0;list-style:none}li{background:#173540;padding:16px;border-radius:8px;margin-bottom:10px}li button{display:block}
a{color:#f0cb86}#status{color:#bde7de;min-height:25px}#login{max-width:590px}
@media(min-width:900px){body{padding-top:95px}#management{max-width:650px}}
</style></head><body>
<h1>O Portal dos Heróis</h1><p>A luz dos faróis enfraquece. Entre na sua conta de teste, escolha entre A Vigília e A Confluência e continue sua jornada. Até oito personagens por conta.</p>
<form id="login"><label>Chave privada da conta de teste <input id="token" type="password" autocomplete="off" required></label><button>Conectar</button></form>
<p id="status" role="status"></p><section id="management" hidden><h2>Personagens</h2><ul id="characters"></ul>
<form id="create"><label>Facção <select id="faction"><option value="vigilia">A Vigília</option><option value="confluencia">A Confluência</option></select></label>
<label>Povo <select id="race"></select></label><label>Classe <select id="class"><option value="sentinela">Sentinela</option><option value="arcanista">Arcanista</option><option value="errante">Errante</option><option value="ressonante">Ressonante</option></select></label>
<label>Nome <input id="name" required minlength="3" maxlength="18"></label><button>Criar personagem</button></form><button id="logout">Sair da conta</button></section>
<p><a href="/">Explorar o Vale de Alvor</a></p><script type="module" src="/src/accounts.ts"></script></body></html>
